<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<!-- WebView на телефоне может закэшировать эту страницу и не подхватывать
     новую логику проверки после деплоя — см. SCANNER_VERSION в main.js
     (кэш-бастер в URL кнопки) плюс эти теги как вторая линия защиты. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Сканер КИЗ — LOOKLIE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.3/dist/iife/reader/index.js"></script>
<!-- Только для режима ?mode=check («Проверка КИЗ», см. main.js бота) — не
     нужны в обычном режиме «Восстановления», но подключение лишнего SDK не
     мешает и не грузит сеть, пока не вызван (compat-стиль, глобальный
     `firebase`, без сборки/ES-модулей — соответствует стилю остального файла). -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #camera-wrap { position: fixed; inset: 0; background: #000; }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #canvas { display: none; }

  #reticle {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
    width: 78vw; max-width: 420px; aspect-ratio: 1.4;
    border: 2px solid rgba(255,255,255,0.55); border-radius: 16px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.35);
    pointer-events: none;
  }

  #top-bar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(12px, env(safe-area-inset-top)) 14px 12px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
  }
  #counter {
    font-size: 17px; font-weight: 600;
    background: rgba(20,20,20,0.6); padding: 6px 14px; border-radius: 999px;
    backdrop-filter: blur(6px);
  }
  #db-status {
    font-size: 12px; color: rgba(255,255,255,0.65);
    background: rgba(20,20,20,0.6); padding: 5px 12px; border-radius: 999px;
    backdrop-filter: blur(6px); margin-left: 8px; white-space: nowrap;
  }
  #db-status.ready { color: #7fe27f; }
  #db-status.error { color: #ff9a6a; }
  #cancel-btn {
    font-size: 15px; color: #fff; background: rgba(20,20,20,0.6);
    border: none; padding: 8px 16px; border-radius: 999px;
  }

  #hint {
    position: fixed; left: 0; right: 0; top: calc(42% + 20vw + 40px);
    text-align: center; font-size: 14px; color: rgba(255,255,255,0.75);
    padding: 0 24px;
  }

  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    max-height: 42vh;
    background: rgba(18,18,18,0.92); backdrop-filter: blur(10px);
    border-radius: 18px 18px 0 0;
    padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column;
  }
  #sheet-title { font-size: 13px; color: rgba(255,255,255,0.6); margin: 4px 0 8px; }
  #code-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
  #code-list li {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,0.08);
    font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  #code-list li .gtin { opacity: 0.6; margin-right: 8px; }
  #code-list li .cis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #code-list li .dot {
    flex: none; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px;
    background: #666; /* статус ещё неизвестен (база не загружена) */
  }
  #code-list li.found .dot { background: #3ddc3d; }
  #code-list li.not-found .dot { background: #ff4d4d; }
  #code-list li.not-found .cis { color: #ff9a9a; }
  #code-list li.warn .dot { background: #ffcc33; }
  #code-list li button {
    flex: none; width: 26px; height: 26px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.12); color: #fff; font-size: 15px; line-height: 1;
  }
  #empty-state { text-align: center; color: rgba(255,255,255,0.45); font-size: 13px; padding: 10px 0; }

  #error-banner {
    display: none;
    position: fixed; inset: 0; background: #111;
    align-items: center; justify-content: center; text-align: center;
    padding: 32px; font-size: 15px; line-height: 1.5; color: #fff;
  }

  #flash {
    position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none;
    transition: opacity 120ms ease-out;
  }
</style>
</head>
<body>

<div id="camera-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="reticle"></div>
</div>
<div id="flash"></div>

<div id="top-bar">
  <button id="cancel-btn" type="button">✕ Отмена</button>
  <div style="display:flex; align-items:center;">
    <div id="counter">0 кодов</div>
    <div id="db-status">⏳ база…</div>
  </div>
</div>

<div id="hint">Наведите камеру на код маркировки (Data Matrix)</div>

<div id="sheet">
  <div id="sheet-title">Отсканировано</div>
  <div id="empty-state">Пока пусто</div>
  <ul id="code-list"></ul>
</div>

<div id="error-banner"></div>

<script>
(function () {
  'use strict';

  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#000000'); } catch (e) {}
    try { tg.setBackgroundColor('#000000'); } catch (e) {}
  }

  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var counterEl = document.getElementById('counter');
  var listEl = document.getElementById('code-list');
  var sheetEl = document.getElementById('sheet');
  var emptyStateEl = document.getElementById('empty-state');
  var cancelBtn = document.getElementById('cancel-btn');
  var errorBanner = document.getElementById('error-banner');
  var flashEl = document.getElementById('flash');

  // cis (полная строка Data Matrix) -> true. Порядок сканирования сохраняется отдельно.
  var seen = Object.create(null);
  var scanned = []; // [{ cis, gtin, found, entityName, mismatch }] — found: true/false/null (null = статус ещё не известен)

  // entity в URL (см. recoveryScanKeyboard в main.js бота) — задан только для
  // «Отмены ошибочного вывода»: юрлицо там уже выбрано вручную ДО скана, и
  // единственное, что имеет смысл проверять живьём во время сканирования —
  // не найден ли этот код проданным ПОД ДРУГИМ юрлицом (mismatch, см. addCode
  // ниже). «Не найден в codes.txt вообще» тут нормальный, ожидаемый результат
  // почти для каждого кода — в отличие от «Возврата от покупателя» (entity в
  // URL не задан), где как раз «не найден» и есть та самая живая проверка.
  var fixedEntityName = new URLSearchParams(location.search).get('entity') || null;

  // Режим «Проверка КИЗ» (см. checkScanKeyboard в main.js бота) — каждый
  // отсканированный код уходит в Firestore и ответ (юрлицо + статус в
  // Честном знаке через True API, считает бот через src/live_check_relay.js)
  // приходит обратно и показывается ПРЯМО В ЭТОМ ОКНЕ, без закрытия —
  // поэтому тут нет ни «Готово» (см. updateMainButton), ни батч-отправки:
  // каждый код независимо создаёт свой документ и подписывается на него.
  var checkMode = new URLSearchParams(location.search).get('mode') === 'check';
  var firestoreDb = null;
  if (checkMode) {
    firebase.initializeApp({
      apiKey: 'AIzaSyDUK8iEHwICrjtZGBWj0zGWAsLDlIb46Yw',
      authDomain: 'looklie-kiz.firebaseapp.com',
      projectId: 'looklie-kiz',
      storageBucket: 'looklie-kiz.firebasestorage.app',
      messagingSenderId: '1094361196543',
      appId: '1:1094361196543:web:fd0cf43f21b1f73e2669ca',
    });
    firestoreDb = firebase.firestore();
  }

  function extractGtin(cis) {
    var m = cis.match(/\(01\)(\d{14})/);
    return m ? m[1] : null;
  }

  // База «известных» кодов (см. README репозитория) — короткая форма без
  // крипто-хвоста (91)/(92), первые 35 символов, ровно как режет truncateCis
  // на боте (src/withdraw/source_1c.js) при публикации codes.txt, вместе с
  // кратким именем юрлица (вторая колонка через таб, см. publish_known_codes.js).
  // Загружается один раз при открытии страницы (см. loadKnownCodes ниже) —
  // дальше проверка «найден/не найден» и юрлицо идут по этой Map полностью
  // в браузере, без сети.
  var knownCodes = null; // Map<string, string> (код -> краткое имя юрлица) | null, пока не загружено
  function shortCis(cis) {
    return cis.slice(0, 35);
  }

  function updateMainButton() {
    if (!tg) return;
    // «Проверка КИЗ» — каждый код уходит независимо, партии нет, поэтому и
    // кнопки «Готово» нет вообще (по прямому указанию).
    if (checkMode) {
      tg.MainButton.hide();
      return;
    }
    if (scanned.length > 0) {
      tg.MainButton.setText('Готово (' + scanned.length + ')');
      tg.MainButton.show();
      tg.MainButton.enable();
    } else {
      tg.MainButton.hide();
    }
  }

  function renderList() {
    counterEl.textContent = scanned.length + (scanned.length === 1 ? ' код' : ' кодов');
    emptyStateEl.style.display = scanned.length === 0 ? 'block' : 'none';
    listEl.innerHTML = '';
    // Новые сверху — удобнее видеть последний скан.
    for (var i = scanned.length - 1; i >= 0; i--) {
      (function (item, index) {
        var li = document.createElement('li');

        if (checkMode) {
          // «Проверка КИЗ» — своя, отдельная и более простая раскладка:
          // цвет/текст только по ответу Firestore (см. addCode), никакой
          // логики codes.txt/found/mismatch тут не участвует вообще. Цвет —
          // по прямому указанию: «в обороте» зелёный, «выбыл»/«списан»
          // красный, остальное жёлтое (см. `color` в live_check_relay.js на
          // боте — .found/.not-found/.warn, CSS уже определён выше).
          if (item.checkStatus && item.checkStatus.color === 'green') li.className = 'found';
          else if (item.checkStatus && item.checkStatus.color === 'red') li.className = 'not-found';
          else if (item.checkStatus && item.checkStatus.color === 'yellow') li.className = 'warn';
          var checkDot = document.createElement('span');
          checkDot.className = 'dot';
          var checkText = document.createElement('span');
          checkText.className = 'cis';
          checkText.textContent = item.checkStatus
            ? (item.checkStatus.entityName ? item.checkStatus.entityName + ': ' : '') + item.checkStatus.statusText
            : '⏳ проверяю…';
          var checkRemoveBtn = document.createElement('button');
          checkRemoveBtn.type = 'button';
          checkRemoveBtn.textContent = '×';
          checkRemoveBtn.addEventListener('click', function () { removeCode(index); });
          li.appendChild(checkDot);
          li.appendChild(checkText);
          li.appendChild(checkRemoveBtn);
          listEl.appendChild(li);
          return;
        }

        if (fixedEntityName) {
          // Режим «Отмена ошибочного вывода» — красным только реальное
          // несовпадение юрлица; «не найден» и «найден, то же юрлицо» — оба
          // нормальный, ожидаемый результат (зелёным, как только база
          // догрузилась; серым — пока не известно).
          if (item.mismatch) li.className = 'not-found';
          else if (item.found !== null) li.className = 'found';
        } else {
          if (item.found === true) li.className = 'found';
          else if (item.found === false) li.className = 'not-found';
        }
        // Найден и продан тем же юрлицом, что выбрано, — не ошибка, но и не
        // «чистый ОК» (соответствует жёлтому предупреждению в чате после
        // «Готово», см. main.js) — номер тут тоже лишний, по тому же правилу.
        var sameEntitySold = !!fixedEntityName && item.found === true && !item.mismatch;
        // Номер (GTIN) показываем только когда код в порядке — в
        // ошибке/несовпадении/предупреждении сам текст сообщения уже всё
        // объясняет, номер рядом с ним просто лишний шум (см. запрос —
        // правило единое для обоих режимов сканирования).
        var isError = fixedEntityName ? (item.mismatch || sameEntitySold) : item.found === false;

        var dot = document.createElement('span');
        dot.className = 'dot';
        var gtinSpan = document.createElement('span');
        gtinSpan.className = 'gtin';
        gtinSpan.textContent = item.gtin || '—';
        var cisSpan = document.createElement('span');
        cisSpan.className = 'cis';
        if (fixedEntityName) {
          if (item.mismatch) cisSpan.textContent = 'КИЗ принадлежит ' + item.entityName + '!!!';
          else if (sameEntitySold) cisSpan.textContent = 'Товар был продан (юрлицо совпадает)';
          else cisSpan.textContent = item.cis;
        } else if (item.found === true) {
          cisSpan.textContent = item.entityName;
        } else if (item.found === false) {
          cisSpan.textContent = 'Не найден КИЗ в 1С';
        } else {
          cisSpan.textContent = item.cis; // статус ещё не известен — база не догрузилась
        }
        var removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.textContent = '×';
        removeBtn.addEventListener('click', function () { removeCode(index); });
        li.appendChild(dot);
        if (!isError) li.appendChild(gtinSpan);
        li.appendChild(cisSpan);
        li.appendChild(removeBtn);
        listEl.appendChild(li);
      })(scanned[i], i);
    }
    updateMainButton();
    // Замечено на практике (Telegram WebView, особенно с checkMode): текст
    // строки меняется в DOM, но экран визуально не перерисовывается, пока не
    // случится "настоящее" событие вроде следующего скана — offsetHeight и
    // requestAnimationFrame (пробовали) тут не помогают. Подозреваемый
    // виновник — backdrop-filter: blur() на #sheet (см. CSS): на части
    // Android WebView такой composited-слой не обновляется сам по себе.
    // Микро-скролл списка — грубый, но куда более надёжный обход именно
    // этого класса багов (форсирует перекомпоновку скроллящегося слоя).
    var scrollTop = listEl.scrollTop;
    listEl.scrollTop = scrollTop + 1;
    listEl.scrollTop = scrollTop;
    // Плюс микро-сдвиг transform на самом #sheet (где висит blur) — на
    // случай, если зависает именно blur-слой, а не скролл списка внутри.
    sheetEl.style.transform = 'translateZ(0.01px)';
    requestAnimationFrame(function () { sheetEl.style.transform = ''; });
  }

  function removeCode(index) {
    var item = scanned[index];
    delete seen[item.cis];
    scanned.splice(index, 1);
    if (tg) tg.HapticFeedback.impactOccurred('light');
    renderList();
  }

  function flash(color) {
    flashEl.style.background = color || '#fff';
    flashEl.style.opacity = '0.55';
    setTimeout(function () { flashEl.style.opacity = '0'; }, 120);
  }

  // Звук успешного скана через Web Audio — без отдельного аудиофайла.
  // На iOS/WKWebView AudioContext стартует в состоянии "suspended", пока его
  // не "разблокирует" пользовательский жест ВНУТРИ этой страницы — а при
  // автосканировании пользователь обычно вообще ничего не тапает на экране
  // до первого скана. Поэтому пробуем разблокировать контекст на каждом
  // правдоподобном поводе: сразу при загрузке страницы (переход сюда сам по
  // себе был по тапу на кнопку в Telegram — иногда этого достаточно), в
  // момент, когда пользователь разрешил доступ к камере (тоже связано с его
  // действием), и на первое же касание/клик по самой странице.
  var audioCtx = null;
  function ensureAudioContext() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(function () {});
    return audioCtx;
  }
  ensureAudioContext();
  ['pointerdown', 'touchstart', 'touchend', 'click'].forEach(function (evt) {
    document.addEventListener(evt, ensureAudioContext, { once: true, passive: true });
  });

  // Резкий восходящий "бип-БИП" (как у складского сканера) — square вместо
  // sine (больше обертонов, пробивает шум цеха лучше чистого тона). Громкость
  // (gain) специально загоняется ЗА единицу — цифровой потолок в 1.0 сам по
  // себе уже пройден раньше, дальше наращивать нечего без искажений. Поэтому
  // между тонами и колонкой стоит DynamicsCompressor как жёсткий лимитер:
  // он "сплющивает" пики вместо грубого клиппинга и за счёт этого поднимает
  // среднюю громкость (RMS) заметно выше, чем просто gain=1.
  function playTone(ctx, dest, startTime, freq, duration, peakGain) {
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain);
    gain.connect(dest);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
  }

  function makeLimiter(ctx, now) {
    var limiter = ctx.createDynamicsCompressor();
    limiter.threshold.setValueAtTime(-50, now);
    limiter.knee.setValueAtTime(0, now);
    limiter.ratio.setValueAtTime(20, now);
    limiter.attack.setValueAtTime(0.001, now);
    limiter.release.setValueAtTime(0.1, now);
    limiter.connect(ctx.destination);
    return limiter;
  }

  // Найден в базе — восходящий "бип-БИП" (как раньше).
  function beepFound() {
    var ctx = ensureAudioContext();
    if (!ctx) return;
    var now = ctx.currentTime;
    var limiter = makeLimiter(ctx, now);
    playTone(ctx, limiter, now, 1900, 0.11, 2.4);
    playTone(ctx, limiter, now + 0.11, 2800, 0.17, 3);
  }

  // НЕ найден в базе — низкий нисходящий сигнал, специально другой по
  // характеру (не просто тише/выше), чтобы отличить на слух не глядя на
  // экран, даже в шуме склада.
  function beepNotFound() {
    var ctx = ensureAudioContext();
    if (!ctx) return;
    var now = ctx.currentTime;
    var limiter = makeLimiter(ctx, now);
    playTone(ctx, limiter, now, 420, 0.16, 2.6);
    playTone(ctx, limiter, now + 0.15, 260, 0.22, 2.8);
  }

  // Статус кода относительно базы: { found: true, entityName } — найден,
  // { found: false } — не найден, { found: null } — база ещё не загружена
  // (статус пока не известен).
  function lookupKnown(cis) {
    if (!knownCodes) return { found: null };
    var entityName = knownCodes.get(shortCis(cis));
    return entityName ? { found: true, entityName: entityName } : { found: false };
  }

  function computeMismatch(status) {
    return !!fixedEntityName && status.found === true && status.entityName !== fixedEntityName;
  }

  // «Проверка КИЗ» — своя ветка добавления: не сверяемся с codes.txt (тут это
  // не нужно, ответ придёт от бота через Firestore), просто регистрируем
  // скан и шлём документ. Ответ забираем ОПРОСОМ (не подпиской onSnapshot —
  // в WebView Telegram живая подписка на практике «зависала»: ответ уже был
  // записан ботом, но до экрана долетал только после следующего сетевого
  // события). Опрос повешен ДВАЖДЫ — и на setInterval, и на
  // requestAnimationFrame внутри scanLoop — на практике непонятно, какой из
  // двух таймеров реально надёжен в конкретном WebView на конкретном
  // телефоне, поэтому подстраховываемся обоими сразу (вызов идемпотентен,
  // лишний параллельный .get() не страшен). Плюс жёсткий таймаут — если за
  // 20 секунд ответа так и нет, показываем ошибку, а не вечное «проверяю»,
  // чтобы неполадка была видна, а не молча зависала.
  var pendingChecks = []; // [{ item, docRef, addedAt }]
  var CHECK_TIMEOUT_MS = 20000;

  function pollPendingChecks() {
    if (pendingChecks.length === 0) return;
    var now = Date.now();
    var stillPending = [];
    Promise.all(pendingChecks.map(function (p) {
      if (now - p.addedAt > CHECK_TIMEOUT_MS) {
        p.item.checkStatus = { entityName: null, statusText: '❌ нет ответа (таймаут)' };
        return Promise.resolve();
      }
      return p.docRef.get().then(function (snap) {
        var data = snap.data();
        if (data && data.result) {
          p.item.checkStatus = data.result;
        } else {
          stillPending.push(p);
        }
      }).catch(function () {
        stillPending.push(p);
      });
    })).then(function () {
      pendingChecks = stillPending;
      renderList();
    });
  }
  setInterval(pollPendingChecks, 1000);
  var lastCheckPollAt = 0;

  function addCheckCode(cis) {
    if (seen[cis]) return;
    seen[cis] = true;
    var item = { cis: cis, checkStatus: null };
    scanned.push(item);
    flash('#fff');
    beepFound();
    if (tg) tg.HapticFeedback.notificationOccurred('success');
    renderList();

    firestoreDb.collection('checks').add({
      cis: cis,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      result: null,
    }).then(function (docRef) {
      pendingChecks.push({ item: item, docRef: docRef, addedAt: Date.now() });
    }).catch(function () {
      item.checkStatus = { entityName: null, statusText: '❌ ошибка отправки' };
      renderList();
    });
  }

  function addCode(cis) {
    if (checkMode) { addCheckCode(cis); return; }
    if (seen[cis]) return;
    seen[cis] = true;
    var status = lookupKnown(cis);
    var mismatch = computeMismatch(status);
    scanned.push({ cis: cis, gtin: extractGtin(cis), found: status.found, entityName: status.entityName || null, mismatch: mismatch });

    // Режим «Отмена ошибочного вывода» (fixedEntityName задан) — ошибка
    // только при реальном несовпадении юрлица; «не найден» тут норма, а не
    // повод пугать оператора красным. Обычный режим («Возврат от
    // покупателя») — как раньше, ошибка при found === false.
    var isError = fixedEntityName ? mismatch : status.found === false;
    if (isError) {
      flash('#ff3b30');
      beepNotFound();
      if (tg) tg.HapticFeedback.notificationOccurred('error');
    } else {
      // Код всё равно добавлен и попадёт в итоговую проверку на боте.
      flash('#fff');
      beepFound();
      if (tg) tg.HapticFeedback.notificationOccurred('success');
    }
    renderList();
  }

  // Как только база догрузилась — досчитать статус для того, что уже
  // успели отсканировать ДО этого момента (первые пару секунд после
  // открытия сканера, пока идёт fetch codes.txt).
  function recheckScannedAgainstKnownCodes() {
    if (!knownCodes) return;
    var changed = false;
    for (var i = 0; i < scanned.length; i++) {
      if (scanned[i].found === null) {
        var status = lookupKnown(scanned[i].cis);
        scanned[i].found = status.found;
        scanned[i].entityName = status.entityName || null;
        scanned[i].mismatch = computeMismatch(status);
        changed = true;
      }
    }
    if (changed) renderList();
  }

  var dbStatusEl = document.getElementById('db-status');

  function loadKnownCodes() {
    fetch('./codes.txt', { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (text) {
        var lines = text.split('\n');
        var map = new Map();
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].replace(/\r$/, '');
          if (!line) continue;
          var tabIdx = line.indexOf('\t');
          if (tabIdx === -1) continue;
          map.set(line.slice(0, tabIdx), line.slice(tabIdx + 1));
        }
        knownCodes = map;
        dbStatusEl.textContent = '✅ ' + map.size;
        dbStatusEl.className = 'ready';
        recheckScannedAgainstKnownCodes();
      })
      .catch(function () {
        dbStatusEl.textContent = '⚠️ офлайн';
        dbStatusEl.className = 'error';
        // knownCodes остаётся null — все коды идут с нейтральным статусом
        // (found: null), проверка на боте по нажатию «Готово» всё равно сработает.
      });
  }
  // codes.txt нужен в режимах «Восстановления» («Возврату от покупателя» —
  // для живой подсказки найден/не найден, «Отмене ошибочного вывода» — чтобы
  // поймать несовпадение юрлица, см. computeMismatch/fixedEntityName выше).
  // «Проверке КИЗ» (checkMode) он не нужен вообще — ответ идёт через
  // Firestore, а не через эту локальную базу.
  if (!checkMode) loadKnownCodes();
  else {
    dbStatusEl.textContent = '';
  }

  function showFatalError(text) {
    errorBanner.textContent = text;
    errorBanner.style.display = 'flex';
  }

  cancelBtn.addEventListener('click', function () {
    if (tg) {
      // Пустой список — сигнал отмены для бота (см. web_app_data в main.js):
      // сбрасывает сессию и возвращает главное меню, а не просто закрывает
      // страницу, оставляя бота ждать скана и старую клавиатуру висеть.
      // sendData() сам закрывает WebApp — отдельный tg.close() не нужен.
      tg.sendData(JSON.stringify([]));
    } else {
      showFatalError('Можно закрыть эту вкладку.');
    }
  });

  if (tg) {
    tg.MainButton.onClick(function () {
      if (scanned.length === 0) return;
      var payload = scanned.map(function (s) { return s.cis; });
      tg.sendData(JSON.stringify(payload));
    });
    tg.MainButton.setParams({ color: '#2ea6ff' });
    tg.BackButton.show();
    // Та же отмена, что и у «✕ Отмена» (см. выше) — иначе нативная кнопка
    // назад просто закрывала бы страницу молча, оставляя бота ждать скана.
    tg.BackButton.onClick(function () { tg.sendData(JSON.stringify([])); });
  }

  var scanning = false;
  var stream = null;

  function scanLoop() {
    if (!stream) return;
    if (checkMode) {
      var nowTs = Date.now();
      if (nowTs - lastCheckPollAt > 1000) {
        lastCheckPollAt = nowTs;
        pollPendingChecks();
      }
    }
    if (!scanning && video.videoWidth > 0) {
      scanning = true;
      var w = video.videoWidth, h = video.videoHeight;
      // Понижаем разрешение кадра для скорости распознавания — точность
      // Data Matrix на телефонной камере с этим не страдает на разумной дистанции.
      var scale = Math.min(1, 900 / Math.max(w, h));
      var cw = Math.round(w * scale), ch = Math.round(h * scale);
      canvas.width = cw;
      canvas.height = ch;
      ctx.drawImage(video, 0, 0, cw, ch);
      var imageData = ctx.getImageData(0, 0, cw, ch);

      window.ZXingWASM.readBarcodes(imageData, {
        formats: ['DataMatrix'],
        tryHarder: true,
        maxNumberOfSymbols: 8,
      }).then(function (results) {
        for (var i = 0; i < results.length; i++) {
          if (results[i].isValid && results[i].text) addCode(results[i].text);
        }
      }).catch(function () {
        // Отдельный неудачный кадр — не ошибка, просто пробуем следующий.
      }).then(function () {
        scanning = false;
      });
    }
    requestAnimationFrame(scanLoop);
  }

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false,
  }).then(function (s) {
    stream = s;
    video.srcObject = s;
    ensureAudioContext();
    requestAnimationFrame(scanLoop);
  }).catch(function (err) {
    showFatalError('Не удалось получить доступ к камере: ' + err.message + '. Разрешите доступ к камере для этого сайта в настройках Telegram/браузера и откройте сканер заново.');
  });

  renderList();
})();
</script>

</body>
</html>
